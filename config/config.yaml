# --- Resume Maker ---
# Controls resume maker behavior when you use the web UI.
resume_maker:
  # If true, summarize the job description locally via Ollama before AI polish.
  # If false, skip local summarization and send the original JD to the selected model.
  use_local_jd_summary: false

# --- Job Search Criteria ---
search:
  # List of job title queries to search for (bot runs each query)
  queries:
    - "Software Engineer"
    - "Python Developer"
    - "MERN"
    - "Web Scrapper"
    - "Stack Developer"
    - "Full Stack"
    - "Full-Stack"
    - "Full Stack Developer"
    - "Backend Developer"
    - "Frontend Developer"
    - "Data Engineer"
    - "Next.js Developer"
    - "React Developer"
    - "Generative AI Engineer"
    - "Backend/AI Engineer"
    - "Agentic AI Developer"
    - "AI Application Engineer"
    - "AI Engineer, Agentic AI"
    - "Senior Developer (Python)"
    - "AI Engineer/Solution Architect"
    - "AI Engineer/Developer"
    - "AI Engineer/Architect"
    - "Integration Developer"
    
  # Location (city, state, or "remote")
  location: "remote"

  # Distance radius in miles (5, 10, 15, 25, 50, 100)
  radius: 25

  # Job type filter: "fulltime", "parttime", "contract", "temporary", "internship", or "" for all
  job_type: ""

  # Experience level: "entry_level", "mid_level", "senior_level", or "" for all
  experience_level: ""

  # Salary minimum (0 to disable filter)
  salary_min: 0

  # Date posted: "1" (24h), "3" (3 days), "7" (7 days), "14" (14 days), or "" for any time
  date_posted: "7"

  # Only apply to "Easy Apply" jobs.
  # Set to false (or enable company_site_apply below) to also see company-site jobs.
  easy_apply_only: true

  # Maximum number of pages to scan per search query
  max_pages: 5

# --- Bot Behavior ---
bot:
  # Mode: "semi" (review each job before applying) or "auto" (apply automatically)
  mode: "semi"
  # Number of concurrent apply agents (1 keeps legacy single-agent flow)
  agents: 1
  orchestrator:
    enabled: true
    max_concurrent_agents: 4
    headless_per_agent: null
    control_center: true
    host: "127.0.0.1"
    port: 5000
    # Countries to search. Bot runs all queries on each country's Indeed site.
    # Supported: us, pk, uk, ca, au, in
    # us = indeed.com | pk = pk.indeed.com | uk = uk.indeed.com
    countries:
      # - us
      - pk
      - uk
      - ca
      - au
      - in
      - ae

  # Maximum applications per session (0 = unlimited)
  max_applications: 25

  # Delay ranges in seconds (randomized within range)
  delays:
    # Ordinary listings stay responsive while avoiding back-to-back requests.
    between_jobs_min: 8
    between_jobs_max: 20
    # A completed application creates more server traffic than a simple skip.
    after_application_min: 15
    after_application_max: 30
    # A cleared CAPTCHA gets a short pause; navigation timeouts remain cautious.
    captcha_cooldown_min: 10
    captcha_cooldown_max: 20
    throttle_cooldown_min: 60
    throttle_cooldown_max: 120
    navigation_retry_attempts: 1
    navigation_retry_delay_min: 5
    navigation_retry_delay_max: 10
    between_pages_min: 3
    between_pages_max: 8
    between_actions_min: 1
    between_actions_max: 3
    typing_min_ms: 12
    typing_max_ms: 35

  # Take a screenshot after each application
  screenshot_on_apply: true

  # Take a screenshot on errors
  screenshot_on_error: true

  # Browser settings
  browser:
    # "legacy" launches the existing Playwright-managed browser profile.
    # "extension" uses a dedicated tab in your normal Chrome window through
    # the unpacked extension in extension/chrome. Legacy remains the default.
    mode: "extension"
    headless: false  # Set to true for background operation (higher detection risk)
    slow_mo: 0       # Milliseconds to slow down each Playwright action
    viewport_width: 1366
    viewport_height: 768
    extension:
      host: "127.0.0.1"
      port: 8765
      connect_timeout_seconds: 45
      command_timeout_seconds: 30
      start_url: "https://www.indeed.com/"
      reuse_dedicated_tab: true
      close_tab_on_exit: false
      fast_form_mode: true       # Skip Playwright-style long waits in extension mode
      token_env: "INDEED_EXTENSION_TOKEN"

# --- Keywords to Skip ---
# Jobs containing these keywords in title/description will be skipped
skip_keywords:
  - "clearance required"
  - "security clearance"

# --- Companies to Skip ---
# Jobs from these companies will be skipped
skip_companies: []


# --- Company Site Apply ---
# When enabled the bot will also try to apply on the employer's own website
# for jobs that do NOT have an Indeed Easy Apply button.
# Enabling this automatically disables the easy_apply_only URL filter so both
# job types appear in search results.
company_site_apply:
  enabled: false              # Set to true to activate
  max_wait_seconds: 15        # Max seconds to wait for external pages to load
  skip_if_login_required: true  # Skip jobs that require account creation
  save_email_leads: true      # Persist email-only jobs to data/manual_apply_needed.csv


preferences:
  education: "Bachelor's Degree"
